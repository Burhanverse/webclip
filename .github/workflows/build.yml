name: Build & Test

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*', '*' ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libcurl4-openssl-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            libqt6svg6-dev \
            qt6-wayland \
            libqt6waylandclient6 \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-dialogs \
            qml6-module-qtqml-workerscript \
            qml6-module-qtqml-models \
            qml6-module-qt-labs-platform \
            qml6-module-qt-labs-settings \
            qt6-image-formats-plugins \
            wl-clipboard \
            xclip

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build WebClip
        run: |
          cmake --build build --parallel

      - name: Sanity check
        run: |
          ./build/webclip --help

      - name: Build Linux AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Package Linux Tarball
        run: |
          chmod +x packaging/pack_linux_tarball.sh
          ./packaging/pack_linux_tarball.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: webclip-linux-x86_64
          path: |
            webclip-linux-x86_64.AppImage
            webclip-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: Eden-CI/msvc-dev-cmd@master

      - name: Determine project version
        shell: pwsh
        run: |
          $match = Select-String -Path "src/version.hpp" -Pattern 'VERSION_STRING\s*=\s*"([^"]+)"'
          if (-not $match) { Write-Error "Could not parse VERSION_STRING from src/version.hpp"; exit 1 }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "Detected project version: $version"
          "PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Install libcurl via vcpkg
        run: |
          vcpkg install curl:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build WebClip
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Bundle with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "deploy"
          Copy-Item "build/Release/webclip.exe" -Destination "deploy/"

          # Copy libcurl and dependencies from vcpkg
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin") {
              Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" -Destination "deploy/" -ErrorAction SilentlyContinue
          }
          if (Test-Path "build/vcpkg_installed/x64-windows/bin") {
              Copy-Item "build/vcpkg_installed/x64-windows/bin/*.dll" -Destination "deploy/" -ErrorAction SilentlyContinue
          }

          windeployqt `
            deploy/webclip.exe `
            --qmldir src/gui/qml `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            --compiler-runtime `
            --verbose 1

          Write-Host "=== Validating Executable Imports ==="
          dumpbin /dependents deploy/webclip.exe

          New-Item -ItemType Directory -Force -Path "portable/webclip"
          Copy-Item -Recurse "deploy/*" -Destination "portable/webclip/"
          Compress-Archive -Path "portable/webclip" -DestinationPath "webclip-windows-x64-portable.zip" -Force

      - name: Verify Clean Execution
        shell: pwsh
        run: |
          $cleanPath = "C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\"
          $proc = Start-Process -FilePath "deploy/webclip.exe" -ArgumentList "--help" -Environment @{ PATH = $cleanPath } -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) {
              Write-Error "Clean environment sanity check failed! Exit code: $($proc.ExitCode)"
              exit 1
          }
          Write-Host "Sanity check passed: webclip.exe successfully executed in isolated environment."

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          if (-not (Get-Command "iscc.exe" -ErrorAction SilentlyContinue)) {
              choco install innosetup --no-progress -y
              $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc.exe /DMyAppVersion="$env:PROJECT_VERSION" packaging/setup.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: webclip-windows-x64
          path: |
            webclip-windows-x64-portable.zip
            webclip-setup-x64.exe

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-dist
          find artifacts -type f -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Prepare release notes
        run: |
          echo "Release ${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          files: release-dist/*
