name: Build & Test

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*', '*' ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libcurl4-openssl-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-tools-dev \
            libqt6svg6-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            wl-clipboard \
            xclip

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build WebClip
        run: |
          cmake --build build --parallel

      - name: Sanity check CLI invocation
        run: |
          ./build/webclip --help

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: webclip-linux-x86_64
          path: build/webclip

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: Eden-CI/msvc-dev-cmd@master

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Install libcurl via vcpkg
        run: |
          vcpkg install curl:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build WebClip
        run: |
          cmake --build build --config Release --parallel

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: webclip-windows-x64
          path: build/Release/webclip.exe

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (Test-Path "patches-bundle.json") {
              $bundle = Get-Content -LiteralPath "patches-bundle.json" -Raw | ConvertFrom-Json
              $notes = [string]$bundle.description
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
              $notes = "Public mirror release for $env:GITHUB_REF_NAME."
          }
          Set-Content -LiteralPath "release-notes.md" -Value $notes -Encoding utf8

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          files: |
            build/Release/webclip.exe
